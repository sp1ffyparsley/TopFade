<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc">
  <title id="title">How TopFade works on Windows and macOS</title>
  <desc id="desc">Windows controls the original window with Win32. macOS captures a window with ScreenCaptureKit and displays a floating replica with AppKit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161e2e"/>
      <stop offset="1" stop-color="#222b3e"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="310" rx="22" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="50" y="53" font-size="23" fill="#f4f7ff" font-weight="700">One workflow, two platform strategies</text>
    <text x="54" y="91" font-size="14" fill="#aabbd1">Windows modifies native window properties; macOS draws a permission-based replica.</text>
    <rect x="51" y="119" width="490" height="154" rx="16" fill="#26364a" stroke="#5a7797"/>
    <rect x="580" y="119" width="490" height="154" rx="16" fill="#322f4a" stroke="#7a6e9a"/>
    <text x="76" y="156" font-size="21" fill="#9edcf4" font-weight="700">Windows</text>
    <text x="605" y="156" font-size="21" fill="#c8b6ff" font-weight="700">macOS</text>
    <rect x="77" y="177" width="163" height="57" rx="9" fill="#3b6781"/>
    <text x="159" y="199" text-anchor="middle" font-size="14" fill="#effbff">TopFade</text>
    <text x="159" y="218" text-anchor="middle" font-size="12" fill="#c3dbe8">Rust + Win32</text>
    <path d="M249 206h66m-9-6 9 6-9 6" fill="none" stroke="#9edcf4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="325" y="177" width="190" height="57" rx="9" fill="#40546e"/>
    <text x="420" y="199" text-anchor="middle" font-size="14" fill="#f0f6ff">Original window</text>
    <text x="420" y="218" text-anchor="middle" font-size="12" fill="#c9d4e4">Pin / alpha / input</text>
    <rect x="606" y="177" width="177" height="57" rx="9" fill="#685987"/>
    <text x="695" y="199" text-anchor="middle" font-size="14" fill="#f8f4ff">ScreenCaptureKit</text>
    <text x="695" y="218" text-anchor="middle" font-size="12" fill="#e1d6f9">Capture pixels</text>
    <path d="M792 206h56m-9-6 9 6-9 6" fill="none" stroke="#c8b6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="858" y="177" width="182" height="57" rx="9" fill="#5f557a"/>
    <text x="949" y="199" text-anchor="middle" font-size="14" fill="#f8f4ff">AppKit replica</text>
    <text x="949" y="218" text-anchor="middle" font-size="12" fill="#e1d6f9">Floating, view-first</text>
  </g>
</svg>
