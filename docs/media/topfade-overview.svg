<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">TopFade product concept</title>
  <desc id="desc">An illustration of two overlapping desktop windows and a compact TopFade control palette featuring always on top, opacity, and click through controls.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171e2d"/>
      <stop offset="1" stop-color="#101421"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303b52"/>
      <stop offset="1" stop-color="#222b3b"/>
    </linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72d2f0"/>
      <stop offset="1" stop-color="#a991f5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#050a13" flood-opacity=".58"/>
    </filter>
  </defs>
  <rect width="1120" height="520" rx="24" fill="url(#desk)"/>
  <circle cx="961" cy="85" r="166" fill="#394c73" opacity=".14"/>
  <circle cx="193" cy="460" r="198" fill="#426c83" opacity=".12"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="59" fill="#c4d2e7" font-size="17" font-weight="600" letter-spacing="2">TOPFADE / WORKFLOW</text>
    <text x="60" y="97" fill="#f5f8ff" font-size="28" font-weight="700">Keep the reference in view</text>
    <g filter="url(#shadow)">
      <rect x="70" y="152" width="602" height="300" rx="18" fill="#242f43" stroke="#51617c"/>
      <path d="M88 152h566a18 18 0 0 1 18 18v28H70v-28a18 18 0 0 1 18-18z" fill="#354159"/>
      <circle cx="101" cy="176" r="5" fill="#ea8085"/><circle cx="119" cy="176" r="5" fill="#e8bf74"/><circle cx="137" cy="176" r="5" fill="#8ecfb0"/>
      <text x="163" y="182" fill="#d3def0" font-size="13">Editing workspace</text>
      <rect x="96" y="228" width="230" height="17" rx="8" fill="#435471"/>
      <rect x="96" y="265" width="413" height="10" rx="5" fill="#435471"/>
      <rect x="96" y="289" width="338" height="10" rx="5" fill="#435471"/>
      <rect x="96" y="313" width="379" height="10" rx="5" fill="#435471"/>
      <rect x="96" y="365" width="552" height="59" rx="10" fill="#1b2433"/>
      <rect x="113" y="383" width="172" height="22" rx="6" fill="#3e7d92"/>
      <rect x="296" y="383" width="107" height="22" rx="6" fill="#40506d"/>
      <rect x="414" y="383" width="217" height="22" rx="6" fill="#40506d"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="359" y="229" width="440" height="243" rx="16" fill="#c9d9e9" fill-opacity=".23" stroke="#adddf1" stroke-width="2"/>
      <path d="M376 229h406a17 17 0 0 1 17 17v23H359v-23a17 17 0 0 1 17-17z" fill="#c7e6f7" fill-opacity=".88"/>
      <text x="380" y="255" fill="#223449" font-size="14" font-weight="700">Reference window</text>
      <rect x="386" y="296" width="382" height="142" rx="12" fill="url(#tint)" fill-opacity=".55"/>
      <circle cx="481" cy="354" r="40" fill="#dffaff" fill-opacity=".65"/>
      <path d="M386 414l103-91 91 72 98-83 90 102v24H386z" fill="#243c64" fill-opacity=".49"/>
      <text x="408" y="460" font-size="13" fill="#e6f8ff" font-weight="600">Pinned above the editor</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="800" y="131" width="278" height="307" rx="20" fill="url(#surface)" stroke="#536780"/>
      <text x="826" y="166" font-size="22" fill="#f6faff" font-weight="700">TopFade</text>
      <text x="827" y="191" font-size="13" fill="#abc0d9">Reference window</text>
      <rect x="828" y="212" width="222" height="41" rx="10" fill="#3b5568"/>
      <circle cx="845" cy="232" r="8" fill="#8edfc7"/>
      <text x="863" y="237" font-size="14" fill="#f5fffd" font-weight="600">Always on top</text>
      <text x="827" y="286" font-size="14" fill="#c9d7e9">Opacity</text>
      <text x="1013" y="286" text-anchor="end" font-size="15" fill="#d8f9ff" font-weight="700">65%</text>
      <rect x="828" y="306" width="222" height="6" rx="3" fill="#4a586c"/>
      <rect x="828" y="306" width="144" height="6" rx="3" fill="url(#tint)"/>
      <circle cx="972" cy="309" r="11" fill="#c8f5fa" stroke="#75c2e1" stroke-width="3"/>
      <rect x="828" y="338" width="222" height="42" rx="10" fill="#293749" stroke="#5b6981"/>
      <text x="845" y="364" font-size="14" fill="#dbe7f7">Click-through</text>
      <rect x="998" y="351" width="35" height="18" rx="9" fill="#4b5970"/>
      <circle cx="1007" cy="360" r="7" fill="#d9e3f1"/>
      <text x="829" y="410" font-size="12" fill="#93a9c4">ALT + SHIFT + SCROLL</text>
    </g>
  </g>
</svg>
