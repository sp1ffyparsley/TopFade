[package]
name = "topfade"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native Windows build of the TopFade always-on-top and opacity controller"
license = "MIT"
repository = "https://github.com/Tavito/TopFade"
build = "build.rs"

[package.metadata.winresource]
OriginalFilename = "TopFade.exe"
ProductName = "TopFade"
FileDescription = "Always-on-top and window opacity controller"
LegalCopyright = "Copyright (c) 2026 Tavito"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.34", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
global-hotkey = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "unwind"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
